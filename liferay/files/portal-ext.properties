## Tracer-MED x Liferay -- portal-ext.properties
## Configurado para usar o Postgres 16 do docker-compose (serviço "db").
## Este arquivo é copiado pelo entrypoint da imagem oficial para
## /opt/liferay/portal-ext.properties ANTES do Liferay iniciar.

jdbc.default.driverClassName=org.postgresql.Driver
jdbc.default.url=jdbc:postgresql://db:5432/lportal
jdbc.default.username=liferay
jdbc.default.password=liferay

## Evita o setup wizard interativo na primeira subida (produção).
setup.wizard.enabled=false

## Permite acesso interno (rede docker): screenshots, madhava-service, etc.
virtual.hosts.valid.hosts=localhost,127.0.0.1,tracer-med-liferay,madhava-service,172.22.0.3,172.*

