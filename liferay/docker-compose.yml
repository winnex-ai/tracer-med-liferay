# Tracer-MED × Tracer-GOV × Liferay -- Compose base (Fase 1)
# Liferay CE 7.4 + Postgres 16. O serviço de ponte Madhava entra na Fase 2.
#
# Uso:
#   docker compose -f liferay/docker-compose.yml up -d --build
#   # aguardar ~1-3 min na primeira subida (initial build + portal)
#   curl -I http://localhost:8080
#
# Dados persistentes em liferay/volumes/ (fora do container).
# Os bundles Winnex (Tracer-MED + Tracer-GOV) são instalados via Dockerfile
# (liferay/docker/Dockerfile) — NÃO copiados manualmente.

services:
  liferay:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: tracer-liferay:1.0.0
    container_name: tracer-med-liferay
    ports:
      - "8080:8080"
    environment:
      # Memória (RAM disponível: 28GB)
      CATALINA_OPTS: "-Xms1g -Xmx3g -XX:MaxMetaspaceSize=1g"
      # Serviço de embeddings (winnex-ai-normalize) alcançado via o gateway do
      # host Docker — o container Liferay não está na mesma rede do normalize.
      # Os portlets Tracer-MED/GOV embutem a query aqui (P1.5).
      NORMALIZE_SERVICE_URL: "http://172.17.0.1:8103"
    volumes:
      # Padrão oficial da imagem: /mnt/liferay/files/* é copiado para
      # /opt/liferay ANTES do portal iniciar. O portal-ext.properties
      # (JDBC Postgres) está em ./files/.
      - ./files:/mnt/liferay/files:ro
      # NOTA: os bundles Winnex (Tracer-MED + Tracer-GOV) são instalados via
      # Dockerfile em /opt/liferay/deploy — NÃO sobrescrever com bind mount.
      # Dados persistentes (osgi, tomcat, log)
      - ./volumes/data:/opt/liferay/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - tracer-net

  db:
    image: postgres:16-alpine
    container_name: tracer-med-db
    environment:
      POSTGRES_DB: lportal
      POSTGRES_USER: liferay
      POSTGRES_PASSWORD: liferay
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferay -d lportal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracer-net

  # Fase 2 -- ponte Madhava->Liferay (mesma rede; o módulo OSGi chama
  # http://madhava-service:8600). Build do Dockerfile em madhava-service/.
  madhava-service:
    build: ../madhava-service
    container_name: tracer-med-madhava
    ports:
      - "8600:8600"
    env_file:
      - ../madhava-service/.env
    environment:
      TRACER_MED_EVIDENCE_PATH: /var/lib/tracer-med/evidence
    # O provider de embeddings (bge-m3 local no host :8102) é alcançado via
    # host.docker.internal — sem isto o madhava-service não resolve o sglang
    # e o embed de query falha (EmbeddingService: ALL providers unavailable).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - madhava-evidence:/var/lib/tracer-med/evidence
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8600/v1/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tracer-net

volumes:
  db-data:
  madhava-evidence:

networks:
  tracer-net:
    driver: bridge
